<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- VariusCards 3D Product Configurator -->
<iframe
  id="varius-configurator"
  src=""
  style="width:100%;height:650px;border:0;border-radius:12px;background:transparent;"
  allowtransparency="true"
  title="3D Product Configurator">
</iframe>

<!-- Configuration Script -->
<script>
  // =========================================================================
  // 1. EMBED CONFIGURATION (Pre-configured with your organization theme)
  // =========================================================================
  var EMBED_CONFIG = {
    "panelPosition": "left",
    "panelSpacing": "0px",
    "theme": {
        "combinePanels": true,
        "containerBackground": "transparent",
        "panelBackground": "rgba(255, 255, 255, 0.92)",
        "panelBorder": "1px solid rgba(0, 0, 0, 0.08)",
        "panelBoxShadow": "0 10px 30px rgba(0, 0, 0, 0.08)",
        "panelBackdropFilter": "blur(20px)",
        "panelBorderRadius": "16px",
        "textColor": "#1e293b",
        "labelColor": "#0f172a",
        "accentColor": "#739552",
        "panelWidth": "370px",
        "panelHeight": "400px",
        "fontSize": "14px",
        "fontFamily": "'Inter', sans-serif",
        "tabBackground": "rgba(0, 0, 0, 0.04)",
        "tabActiveBackground": "#739552",
        "tabTextColor": "#64748b",
        "tabActiveTextColor": "#ffffff",
        "accordionBackground": "rgba(255, 255, 255, 0.9)",
        "accordionBorder": "1px solid rgba(0, 0, 0, 0.06)",
        "accordionHeaderBackground": "rgba(255, 255, 255, 0.95)",
        "accordionHeaderExpandedBackground": "rgba(255, 255, 255, 1)",
        "selectBackground": "#ffffff",
        "selectColor": "#0f172a",
        "selectBorder": "1px solid #cbd5e1",
        "selectBorderRadius": "8px",
        "dropdownBackground": "#ffffff",
        "dropdownBackdropFilter": "blur(20px)",
        "sliderColor": "#739552",
        "buttonBackground": "#739552",
        "buttonTextColor": "#ffffff",
        "buttonBorderRadius": "30px",
        "accordionBorderRadius": "12px",
        "tabBorderRadius": "30px"
    },
    "visibility": {
        "tabs": true,
        "resetButton": true,
        "labels": false,
        "watermark": false,
        "bottomControls": false,
        "uploadStyle": "button",
        "visibleSides": [
            "Front",
            "Back"
        ]
    }
};

  // 2. Initialize iframe with encoded configuration
  (function () {
    var iframe = document.getElementById("varius-configurator");
    if (iframe) {
      var baseUrl = "https://dev-3d.vzual.com/embed/ecommerce/d194ab5a23aa95c473ac5775c62bc707";
      var encodedConfig = encodeURIComponent(JSON.stringify(EMBED_CONFIG));
      iframe.src = baseUrl + "?ecomPrice=1&config=" + encodedConfig;
    }
  })();
</script>
</body>
</html>
